[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emissor-nfse"
version = "0.1.0"
description = "Emissor de NFS-e no Sistema Nacional (Padrão Nacional) para empresas do Simples Nacional, com interface web e MCP server."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "lxml>=5",
    "cryptography>=42",
    "requests>=2.31",
    "flask>=3",
    "mcp>=2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
emissor = "emissor.cli:main"

[tool.setuptools.packages.find]
include = ["emissor*"]

[tool.setuptools.package-data]
"emissor.web" = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
